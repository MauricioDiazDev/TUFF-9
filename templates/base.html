{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark-style layout-menu-fixed" dir="ltr" data-theme="theme-default">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Reconocimiento Facial{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon/favicon.ico' %}" />

  <!-- Core CSS -->
  <link rel="stylesheet" href="{% static 'assets/vendor/css/core.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendor/css/theme-default.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendor/fonts/boxicons.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendor/css/pages/page-auth.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css' %}" />
  <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />

  {% block extra_css %}{% endblock %}
</head>

<body>

  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

      <!-- Sidebar -->
      {% include 'includes/sidebar.html' %}
      <!-- /Sidebar -->

      <!-- Page content -->
      <div class="layout-page">
        <div class="content-wrapper">
          <div class="container-xxl flex-grow-1 container-p-y">
            {% block content %}{% endblock %}
          </div>

          <!-- Footer -->
          {% include 'includes/footer.html' %}
          <!-- /Footer -->
        </div>
      </div>
      <!-- /Page content -->

    </div>
  </div>

  <!-- Core JS -->
  <script src="{% static 'assets/vendor/js/helpers.js' %}"></script>
  <script src="{% static 'assets/js/config.js' %}"></script>

  <script src="{% static 'assets/vendor/js/bootstrap.js' %}"></script>
  <script src="{% static 'assets/vendor/js/menu.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js' %}"></script>
  <script src="{% static 'assets/js/main.js' %}"></script>

  <!-- Inicialización de scroll en sidebar -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const sidebar = document.querySelector('#layout-menu');
      if (sidebar && typeof PerfectScrollbar !== 'undefined') {
        new PerfectScrollbar(sidebar);
      }
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>

</html>
